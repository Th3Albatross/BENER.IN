# fly.toml app configuration file generated for benerin on 2026-11-15T21:44:25+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'benerin'
primary_region = 'sin'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.5'

[env]
  APP_DEBUG = 'true'
  APP_ENV = 'production'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/data/database.sql'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  PHP_OPCACHE_ENABLE = '1'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 2
  memory_mb = 1024
